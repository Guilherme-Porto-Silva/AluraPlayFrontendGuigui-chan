<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/structure.css">

    <link rel="stylesheet" href="../css/colors.css">

    <link rel="stylesheet" href="../css/reaction.css">

    <title>AluraPlay</title>

    <link rel="shortcut icon" href="./img/favicon.ico" type="image/x-icon">
</head>

<body>

    <header>

        <nav>

            <a href="../index.html" class="homePageAnchor"></a>

            <a href="./send-video.html" class="uploadPageAnchor"></a>

        </nav>

    </header>

    <main>

        <form data-form>

            <h2>Envie um vídeo!</h3>

            <div>

                <label for="url">Endereço do vídeo</label>

                <input data-url name="url" required placeholder="Por exemplo: https://www.youtube.com/embed/FAY1K2aUg5g" id="url"/>

            </div>

            <div>

                <label for="title">Titulo do vídeo</label>

                <input data-title id="title" name="title" required placeholder="Neste campo, dê o nome do vídeo"/>

            </div>

            <div>

                <label for="image">Imagem de perfil</label>

                <input data-image id="image" name="image" required placeholder="Insira a url da imagem"/>

            </div>

            <input data-button type="submit"/>

        </form>

    </main>

    <script>

        import { createVideo } from "./../js/createVideos.js";

        document.querySelector("[data-form]").addEventListener("submit", (submit) => { createVideo(submit); });

    </script>

</body>

</html>
